  const xExtent = d3.extent(points, p => p.x);
  const xPad = (xExtent[1] - xExtent[0]) * 0.035;
  const xDomain = [xExtent[0] - xPad, xExtent[1] + xPad];

  function draw(container, data, height, title) {
    const width = Math.max(300, container.clientWidth);
    const margin = {top: 14, right: 23, bottom: 56, left: 70};
    const right = width - margin.right;
    const bottom = height - margin.bottom;
    const yExtent = d3.extent([...data.map(p => p.y), 0, 19.976]);
    const yPad = (yExtent[1] - yExtent[0]) * .05;
    const y = d3.scaleLinear().domain([yExtent[0] - yPad, yExtent[1] + yPad]).range([bottom - 3, margin.top + 3]);
    const x = d3.scaleLinear().domain(xDomain).range([margin.left + 3, right - 3]);
    const mx = d3.mean(data, p => p.x), my = d3.mean(data, p => p.y);
    const slope = d3.sum(data, p => (p.x - mx) * (p.y - my)) / d3.sum(data, p => (p.x - mx) ** 2);
    const fit = v => my + slope * (v - mx);
    container.querySelector('svg')?.remove();
    const svg = d3.select(container).insert('svg', ':first-child')
      .attr('viewBox', `0 0 ${width} ${height}`)
      .attr('height', height)
      .attr('role', 'img')
      .attr('aria-label', title);
    svg.append('title').text(title);
    const frame = svg.append('rect').attr('data-chart-frame', '')
      .attr('x', margin.left).attr('y', margin.top).attr('width', right - margin.left)
      .attr('height', bottom - margin.top).attr('fill', 'none')
      .attr('stroke', 'var(--border)');
    const clipId = container.id + '-clip';
    svg.append('defs').append('clipPath').attr('id', clipId).append('rect')
      .attr('x', margin.left + 1).attr('y', margin.top + 1)
      .attr('width', right - margin.left - 2).attr('height', bottom - margin.top - 2);
    svg.append('g').attr('class', 'grid').attr('transform', `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).ticks(height > 320 ? 6 : 5).tickSize(-(right - margin.left)).tickFormat(''));
    const marks = svg.append('g').attr('clip-path', `url(#${clipId})`);
    marks.selectAll('circle').data(data).join('circle')
      .attr('cx', p => x(p.x)).attr('cy', p => y(p.y)).attr('r', 2.3)
      .attr('fill', 'var(--viz-series-1)').attr('opacity', .48);
    marks.append('line').attr('x1', margin.left).attr('x2', right)
      .attr('y1', y(19.976)).attr('y2', y(19.976))
      .attr('stroke', 'var(--foreground)').attr('stroke-dasharray', '5 4').attr('opacity', .8);
    marks.append('line').attr('x1', x(xDomain[0])).attr('x2', x(xDomain[1]))
      .attr('y1', y(fit(xDomain[0]))).attr('y2', y(fit(xDomain[1])))
      .attr('stroke', 'var(--viz-series-2)').attr('stroke-width', 2.5);
    svg.append('g').attr('class', 'axis').attr('transform', `translate(0,${bottom})`)
      .call(d3.axisBottom(x).ticks(width < 500 ? 4 : 7));
    svg.append('g').attr('class', 'axis').attr('transform', `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).ticks(height > 320 ? 6 : 5));
    svg.append('text').attr('class', 'axis-title').attr('data-axis', 'x')
      .attr('x', (margin.left + right) / 2).attr('y', height - 10)
      .attr('text-anchor', 'middle').text('Value head prediction (return points)');
    svg.append('text').attr('class', 'axis-title').attr('data-axis', 'y')
      .attr('transform', `translate(17,${(margin.top + bottom) / 2}) rotate(-90)`)
      .attr('text-anchor', 'middle').text('Realized 60-frame return (points)');
    svg.append('text').attr('class', 'plot-label').attr('x', right - 5)
      .attr('y', y(19.976) - 6).attr('text-anchor', 'end').text('fixed target 20');
    svg.append('text').attr('class', 'plot-label').attr('x', x(xDomain[0] + .12 * (xDomain[1] - xDomain[0])))
      .attr('y', y(fit(xDomain[0] + .12 * (xDomain[1] - xDomain[0]))) - 7)
      .text('fitted trend');

    const overlay = svg.append('rect').attr('data-chart-hit', '')
      .attr('x', margin.left).attr('y', margin.top)
      .attr('width', right - margin.left).attr('height', bottom - margin.top)
      .attr('fill', 'transparent');
    const focus = svg.append('circle').attr('r', 5).attr('fill', 'none')
      .attr('stroke', 'var(--foreground)').attr('stroke-width', 1.5).style('display', 'none');
    const tip = container.querySelector('.tooltip');
    const delaunay = d3.Delaunay.from(data, p => x(p.x), p => y(p.y));
    overlay.on('pointermove', event => {
      const [px, py] = d3.pointer(event, svg.node());
      const p = data[delaunay.find(px, py)];
      focus.attr('cx', x(p.x)).attr('cy', y(p.y)).style('display', null);
      tip.textContent = `Value ${p.x.toFixed(1)} · 60-frame return ${p.y.toFixed(1)}`;
      tip.style.display = 'block';
      const tipX = Math.max(0, Math.min(width - tip.offsetWidth, px + 12));
      const tipY = Math.max(0, py - tip.offsetHeight - 8);
      tip.style.left = tipX + 'px'; tip.style.top = tipY + 'px';
    }).on('pointerleave', () => { focus.style('display', 'none'); tip.style.display = 'none'; });
  }

  function redraw() {
    draw(root.querySelector('#o59-all'), points, 370, 'All 728 predictions; Pearson correlation 0.505');
    draw(root.querySelector('#o59-core'), core, 310, '682 predictions with absolute realized return below 40; Pearson correlation 0.359');
  }
  new ResizeObserver(redraw).observe(root);
  redraw();
})();
</script>
